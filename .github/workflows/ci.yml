name: CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, Linux, X64, llb-rdev]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - run: nix flake check
      - run: nix run .#check
